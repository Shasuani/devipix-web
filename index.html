<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DeviPix — Websites, Apps &amp; AI Tools</title>
<meta name="description" content="DeviPix builds premium websites, full-stack web &amp; mobile apps, and AI-powered tools. Talk to the people who write the code.">

<!-- Fonts: VT323 (terminal/headings), IBM Plex Mono 400/600 (body) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=VT323&display=swap" rel="stylesheet">

<style>
/* =========================================================================
   DeviPix — Phase 1: CRT shell + design system
   Single file, no framework, no build step.
   ========================================================================= */

:root{
  /* phosphor palette */
  --green:        #33ff66;
  --green-dim:    #1e9c43;
  --green-faint:  #12592a;
  --amber:        #ffb000;
  --red:          #ff4e42;

  /* tube + bezel */
  --tube:         #071008;
  --tube-edge:    #04120a;
  --bezel-1:      #221d17;
  --bezel-2:      #17130f;
  --bezel-3:      #0c0a08;

  /* glow tokens */
  --glow-green:   0 0 6px rgba(51,255,102,.55), 0 0 20px rgba(51,255,102,.18);
  --glow-amber:   0 0 6px rgba(255,176,0,.55),  0 0 18px rgba(255,176,0,.18);

  --font-term: "VT323", ui-monospace, monospace;
  --font-body: "IBM Plex Mono", ui-monospace, monospace;
}

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  background:#050403;
  background:radial-gradient(120% 120% at 50% 30%, #0a0806 0%, #050403 70%);
  font-family:var(--font-body);
  color:var(--green);
  display:flex;align-items:center;justify-content:center;
  padding:clamp(8px,2.5vw,40px);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}

/* ---- MONITOR (bezel + screws + brand plate) ------------------------------ */
.monitor{
  position:relative;
  width:min(1080px, 100%);
  height:min(720px, calc(100dvh - 24px));
  border-radius:26px;
  padding:clamp(14px,2.2vw,30px);
  background:
    linear-gradient(160deg, var(--bezel-1), var(--bezel-2) 55%, var(--bezel-3));
  box-shadow:
    inset 0 2px 3px rgba(255,255,255,.05),
    inset 0 -3px 8px rgba(0,0,0,.7),
    0 30px 70px rgba(0,0,0,.75),
    0 4px 12px rgba(0,0,0,.6);
  display:flex;flex-direction:column;
}

/* corner screws */
.screw{
  position:absolute;width:15px;height:15px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #4a4038, #1a1512 70%);
  box-shadow:inset 0 1px 1px rgba(255,255,255,.15), inset 0 -1px 2px rgba(0,0,0,.8), 0 1px 1px rgba(0,0,0,.5);
}
.screw::after{ /* slot */
  content:"";position:absolute;inset:0;margin:auto;width:9px;height:2px;border-radius:1px;
  background:linear-gradient(#0a0806,#2a231d);transform:rotate(35deg);
}
.screw.tl{top:10px;left:10px} .screw.tr{top:10px;right:10px}
.screw.bl{bottom:10px;left:10px} .screw.br{bottom:10px;right:10px}

/* brand plate under the screen */
.plate{
  flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;gap:9px;
  padding-top:clamp(8px,1.4vw,14px);
}
.plate .logo{width:18px;height:18px;color:var(--green-dim);filter:drop-shadow(0 0 4px rgba(51,255,102,.4))}
.plate .name{
  font-family:var(--font-term);font-size:20px;letter-spacing:.32em;
  color:#6a5f52;text-transform:uppercase;padding-left:.1em;
}
.led{
  width:9px;height:9px;border-radius:50%;margin-left:6px;
  background:var(--green);box-shadow:var(--glow-green);
}

/* ---- SCREEN (the CRT tube) ----------------------------------------------- */
.screen{
  position:relative;flex:1 1 auto;min-height:0;
  border-radius:16px/20px;
  background:
    radial-gradient(120% 130% at 50% 45%, var(--tube) 60%, var(--tube-edge) 100%);
  box-shadow:
    inset 0 0 22px rgba(0,0,0,.9),
    inset 0 0 90px rgba(0,0,0,.55),
    0 0 0 2px #05100a;
  overflow:hidden;
  display:flex;flex-direction:column;
}

/* screen content sits above the effect overlays */
.crt-content{position:relative;z-index:2;display:flex;flex-direction:column;height:100%;min-height:0}

/* scanlines */
.screen::before{
  content:"";position:absolute;inset:0;z-index:3;pointer-events:none;
  background:repeating-linear-gradient(0deg, rgba(0,0,0,.22) 0 1px, transparent 1px 3px);
  mix-blend-mode:multiply;
}
/* vignette + refresh band live here */
.fx{position:absolute;inset:0;z-index:4;pointer-events:none;overflow:hidden;border-radius:inherit}
.fx .vignette{position:absolute;inset:0;
  background:radial-gradient(120% 120% at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%);}
.fx .band{position:absolute;left:0;right:0;height:40%;
  background:linear-gradient(180deg, transparent, rgba(51,255,102,.05) 50%, transparent);}

/* power-on flash */
.flash{position:absolute;inset:0;z-index:9;background:#eafff0;pointer-events:none;opacity:0}

/* ---- HEADER STRIP -------------------------------------------------------- */
.topbar{
  flex:0 0 auto;display:flex;align-items:center;gap:12px;
  padding:10px clamp(12px,2vw,20px);
  border-bottom:1px solid rgba(51,255,102,.18);
  font-family:var(--font-term);
}
.topbar .logo{width:22px;height:22px;color:var(--green);filter:drop-shadow(0 0 5px rgba(51,255,102,.6))}
.topbar .os{font-size:22px;letter-spacing:.14em;text-shadow:var(--glow-green)}
.topbar .clock{
  margin-left:auto;font-size:20px;color:var(--green-dim);letter-spacing:.08em;
  font-variant-numeric:tabular-nums;
}

/* ---- TERMINAL BODY (placeholder in Phase 1) ------------------------------ */
.terminal{
  flex:1 1 auto;min-height:0;overflow-y:auto;
  padding:clamp(14px,2vw,22px);
  font-size:15px;line-height:1.55;text-shadow:var(--glow-green);
  scrollbar-width:thin;scrollbar-color:var(--green-faint) transparent;
}
.terminal::-webkit-scrollbar{width:8px}
.terminal::-webkit-scrollbar-thumb{background:var(--green-faint);border-radius:4px}
.terminal .dim{color:var(--green-dim)}
.terminal .amber{color:var(--amber);text-shadow:var(--glow-amber)}
.terminal .line{margin:0 0 3px}
.blink{display:inline-block;width:9px;height:1.05em;background:var(--green);
  vertical-align:-2px;box-shadow:var(--glow-green)}
.terminal .out-line{margin:0 0 3px;white-space:pre-wrap;word-break:break-word}
.terminal .cmd-echo{color:var(--green)}
.terminal .err{color:var(--red);text-shadow:0 0 6px rgba(255,78,66,.5)}
.terminal .ai-reply{color:var(--amber);text-shadow:var(--glow-amber);
  border-left:2px solid var(--amber);padding-left:10px;margin:4px 0 6px}
.terminal .hint b{color:var(--green);cursor:pointer;text-decoration:underline;text-underline-offset:3px}
.terminal .hint b:hover{color:#7dffa6}
/* prompt row */
.promptRow{display:flex;align-items:baseline;position:relative;cursor:text}
.promptRow .ps1{color:var(--green);margin-right:8px}
.promptRow.ai .ps1{color:var(--amber);text-shadow:var(--glow-amber)}
.promptRow.ai{color:var(--amber)}
.promptRow .typed{white-space:pre-wrap;word-break:break-word}
.promptRow #cmd{position:absolute;left:0;top:0;width:100%;height:100%;
  opacity:0;border:0;padding:0;margin:0;font-size:16px;/* 16px = no iOS zoom */
  background:transparent;color:transparent;caret-color:transparent}

/* ---- KEYCAP BUTTON BAR --------------------------------------------------- */
.keys{
  flex:0 0 auto;display:flex;flex-wrap:wrap;gap:9px;
  padding:12px clamp(12px,2vw,20px);
  border-top:1px solid rgba(51,255,102,.18);
}
.key{
  font-family:var(--font-body);font-size:12.5px;font-weight:600;letter-spacing:.06em;
  text-transform:uppercase;cursor:pointer;
  color:var(--green);
  background:linear-gradient(180deg,#123420,#0b1e12);
  border:1px solid var(--green-faint);border-radius:7px;
  padding:9px 14px;
  box-shadow:inset 0 1px 0 rgba(120,255,170,.18), 0 3px 0 #061109, 0 5px 8px rgba(0,0,0,.5);
  transition:transform .05s ease, box-shadow .05s ease, color .15s ease;
}
.key:hover{color:#7dffa6}
.key:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(120,255,170,.18), 0 0 0 #061109}
.key:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.key.accent{
  color:var(--amber);border-color:rgba(255,176,0,.4);
  background:linear-gradient(180deg,#3a2a08,#241a05);
  box-shadow:inset 0 1px 0 rgba(255,210,120,.2), 0 3px 0 #140e02, 0 5px 8px rgba(0,0,0,.5);
}
.key.accent:hover{color:#ffd166}
.key.accent:active{transform:translateY(3px);box-shadow:inset 0 1px 0 rgba(255,210,120,.2), 0 0 0 #140e02}
.key.accent:focus-visible{outline-color:var(--amber)}

/* ---- MOTION -------------------------------------------------------------- */
@media (prefers-reduced-motion: no-preference){
  .led{animation:led-pulse 2.4s ease-in-out infinite}
  .screen{animation:flicker 6s steps(60) infinite}
  .fx .band{animation:refresh 7s linear infinite}
  .flash{animation:power-on 1.1s ease-out forwards}
  .blink{animation:blink 1.06s steps(1) infinite}
}
@keyframes led-pulse{0%,100%{opacity:1}50%{opacity:.45}}
@keyframes flicker{0%,100%{opacity:1}96%{opacity:1}97%{opacity:.97}98%{opacity:1}99%{opacity:.98}}
@keyframes refresh{0%{transform:translateY(-45%)}100%{transform:translateY(255%)}}
@keyframes power-on{0%{opacity:.9}12%{opacity:.6}100%{opacity:0}}
@keyframes blink{50%{opacity:0}}

/* ---- DEBUG PANEL --------------------------------------------------------- */
.dbg-btn{position:fixed;top:10px;right:10px;z-index:50;width:34px;height:34px;
  border-radius:8px;cursor:pointer;font-size:16px;color:var(--green);
  background:#0b1e12;border:1px solid var(--green-faint);
  box-shadow:0 2px 6px rgba(0,0,0,.6)}
.dbg-btn:hover{color:#7dffa6}
.dbg-btn:focus-visible{outline:2px solid var(--green);outline-offset:2px}
.dbg{position:fixed;top:52px;right:10px;z-index:50;width:240px;display:none;
  font-family:var(--font-body);font-size:11.5px;line-height:1.7;color:var(--green-dim);
  background:#08130b;border:1px solid var(--green-faint);border-radius:9px;padding:12px 14px;
  box-shadow:0 8px 24px rgba(0,0,0,.7)}
.dbg.open{display:block}
.dbg h4{margin:0 0 8px;font-family:var(--font-term);font-size:16px;letter-spacing:.14em;color:var(--green)}
.dbg b{color:var(--green)}
.dbg .ok{color:var(--amber)}

/* ---- RESPONSIVE ---------------------------------------------------------- */
@media (max-width:640px){
  .monitor{border-radius:18px;padding:12px}
  .topbar .os{font-size:18px}
  .topbar .clock{font-size:16px}
  .terminal{font-size:14px}
}
</style>
</head>
<body>

<!-- reusable Pixel Frame logo (16x16 grid) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="logo-mark" viewBox="0 0 16 16">
    <g fill="currentColor" shape-rendering="crispEdges">
      <!-- spawning sub-pixel -->
      <rect x="12" y="2" width="2" height="2"/>
      <!-- frame: top bar -->
      <rect x="3" y="5" width="8" height="2"/>
      <!-- frame: sides -->
      <rect x="3" y="7" width="2" height="4"/>
      <rect x="9" y="7" width="2" height="4"/>
      <!-- frame: bottom bar -->
      <rect x="3" y="11" width="8" height="2"/>
    </g>
  </symbol>
</svg>

<button class="dbg-btn" id="dbgBtn" type="button" title="Debug" aria-label="Toggle debug panel">&#9881;</button>
<aside class="dbg" id="dbg" aria-live="polite"></aside>

<main class="monitor">
  <span class="screw tl"></span><span class="screw tr"></span>
  <span class="screw bl"></span><span class="screw br"></span>

  <section class="screen" aria-label="DeviPix terminal">
    <div class="crt-content">

      <!-- header strip -->
      <header class="topbar">
        <svg class="logo" aria-hidden="true"><use href="#logo-mark"/></svg>
        <span class="os">DEVIPIX OS v3.0</span>
        <span class="clock" id="clock" aria-hidden="true">--:--:--</span>
      </header>

      <!-- terminal body -->
      <div class="terminal" id="terminal">
        <div id="out" aria-live="polite"></div>
        <div class="promptRow" id="promptRow" hidden>
          <span class="ps1" id="ps1">&gt;</span>
          <span class="typed" id="typed"></span><span class="blink" id="cur"></span>
          <input id="cmd" type="text" autocomplete="off" autocapitalize="off"
                 autocorrect="off" spellcheck="false" aria-label="Terminal input">

      <!-- keycap buttons -->
      <nav class="keys" aria-label="Terminal commands">
        <button class="key" type="button" data-cmd="services">Services</button>

        <button class="key" type="button" data-cmd="about">About</button>
        <button class="key" type="button" data-cmd="help">Help</button>
        <button class="key accent" type="button" data-ai="1">Ask AI &#9670;</button>
        <button class="key accent" type="button" data-cmd="contact">Contact &#9656;</button>
      </nav>

    </div><!-- /crt-content -->

    <!-- effect overlays -->
    <div class="fx"><div class="vignette"></div><div class="band"></div></div>
    <div class="flash"></div>
  </section>

  <!-- brand plate -->
  <div class="plate">
    <svg class="logo" aria-hidden="true"><use href="#logo-mark"/></svg>
    <span class="name">DeviPix</span>
    <span class="led" aria-hidden="true"></span>
  </div>
</main>

<script>
/* live clock — en-GB, 1s tick */
(function(){
  var el = document.getElementById('clock');
  function tick(){
    el.textContent = new Date().toLocaleTimeString('en-GB');
  }
  tick();
  setInterval(tick, 1000);
})();

/* =========================================================================
   Phase 2 — terminal engine
   ========================================================================= */
(function(){
  var REDUCED = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var out = document.getElementById('out');
  var term = document.getElementById('terminal');
  var row = document.getElementById('promptRow');
  var ps1 = document.getElementById('ps1');
  var typed = document.getElementById('typed');
  var input = document.getElementById('cmd');

  var history = [], hIdx = 0, aiMode = false;
  var COMMANDS = ['services','projects','about','contact','ask','help','clear','exit'];

  /* ---- output helpers ---- */
  function el(cls, html){
    var d = document.createElement('div');
    d.className = 'out-line' + (cls ? ' ' + cls : '');
    d.innerHTML = html; out.appendChild(d);
    term.scrollTop = term.scrollHeight; return d;
  }
  function print(html, cls){ return el(cls, html); }
  function scroll(){ term.scrollTop = term.scrollHeight; }
  var esc = function(s){ return s.replace(/[&<>]/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c]; }); };

  /* typewriter: print lines one char burst at a time (instant if reduced-motion) */
  function type(lines, done){
    if(REDUCED){ lines.forEach(function(l){ el(l.cls, l.html); }); done && done(); return; }
    var i = 0;
    (function nextLine(){
      if(i >= lines.length){ done && done(); return; }
      var l = lines[i++], d = el(l.cls, ''), full = l.html, j = 0;
      (function nextChar(){
        // reveal in small chunks for speed
        j += 2; d.innerHTML = full.slice(0, j); scroll();
        if(j < full.length){ setTimeout(nextChar, 8); }
        else { d.innerHTML = full; setTimeout(nextLine, l.pause || 60); }
      })();
    })();
  }

  /* ---- boot sequence ---- */
  var boot = [
    {cls:'dim', html:'DEVIPIX LABS (TM) UNIFIED OPERATING SYSTEM'},
    {cls:'dim', html:'COPYRIGHT 2019-2026 &nbsp; ALL RIGHTS RESERVED', pause:180},
    {cls:'', html:'&nbsp;'},
    {cls:'', html:'INITIALIZING SYSTEM....................... <span class="amber">OK</span>'},
    {cls:'', html:'LOADING AI CO-PROCESSOR................... <span class="amber">OK</span>', pause:160},
    {cls:'', html:'&nbsp;'},
    {cls:'', html:'DEVIPIX &mdash; FULL-STACK WEB &middot; APPS &middot; AI'},
    {cls:'dim', html:'We build websites, apps and AI-powered tools for people who want them done properly.', pause:160},
    {cls:'', html:'&nbsp;'},
    {cls:'hint', html:'Type a command or tap a key: '+
      ['services','projects','about','contact'].map(function(c){
        return '<b data-run="'+c+'">'+c+'</b>'; }).join(' &middot; ')+
      ' &middot; or <b data-ai="1">ask the AI &#9670;</b>'}
  ];

  /* ---- prompt rendering ---- */
  function render(){
    typed.textContent = input.value;
    ps1.textContent = aiMode ? 'AI>' : '>';
  }
  function focusInput(){ input.focus({preventScroll:true}); }
  function setAI(on){
    aiMode = on; row.classList.toggle('ai', on); render();
    print(on ? 'AI co-processor online. Ask anything about services, process, or pricing. (ESC to exit)'
             : 'Exited AI mode.', on ? 'ai-reply' : 'dim');
  }

  /* ---- command handling ---- */
  function aiReply(q){
    // Placeholder until Phase 6 wires the Cloudflare Worker + Anthropic API.
    print('PROCESSING...', 'dim');
    setTimeout(function(){
      out.lastChild.remove();
      print('[ AI offline &mdash; the live assistant is wired in Phase 6. '+
            'For now: projects are quoted individually; tap CONTACT to start one. ]', 'ai-reply');
    }, 400);
  }

  var HANDLERS = {
    help: function(){
      print('AVAILABLE COMMANDS', 'amber');
      print('  services   projects   about   contact');
      print('  ask &lt;question&gt;   help   clear   exit');
      print('  <span class="dim">history: &uarr;/&darr; &middot; autocomplete: Tab &middot; close/exit: ESC</span>');
    },
    services: function(){ stub('SERVICES.MD'); },
    projects: function(){ stub('~/PROJECTS'); },
    about:    function(){ stub('ABOUT.TXT'); },
    contact:  function(){ stub('NEW TRANSMISSION'); },
    clear:    function(){ out.innerHTML = ''; },
    ask:      function(arg){ if(arg){ aiReply(arg); } else { setAI(true); } },
    exit:     function(){ if(aiMode) setAI(false); else print('Nothing to exit.', 'dim'); },
    // easter eggs
    whoami:   function(){ print('guest@devipix &mdash; a potential client with good taste.'); },
    ls:       function(){ print('services.md  projects/  about.txt  contact.form  <span class="dim">.vault</span>'); },
    'cat .vault': function(){
      print('ACCESSING .vault ...', 'dim');
      setTimeout(function(){ print('&#9888; ACCESS DENIED &mdash; nice try. Lockout engaged for 0.0 seconds.', 'err'); }, 350);
    },
    'sudo hire-me': function(){ print('Elevating privileges... granted.', 'amber'); stub('NEW TRANSMISSION'); }
  };
  function stub(name){
    print('opening [ '+name+' ] ...', 'dim');
    print('<span class="dim">window UI arrives in Phase 3 &mdash; content is being wired.</span>');
  }

  function run(raw){
    var line = (raw||'').trim();
    // echo
    print('<span class="'+(aiMode?'':'cmd-echo')+'">'+(aiMode?'AI&gt; ':'&gt; ')+esc(line)+'</span>');
    if(line){ history.push(line); hIdx = history.length; }

    if(aiMode){
      if(line.toLowerCase() === 'exit' || line.toLowerCase() === 'quit'){ setAI(false); return; }
      if(line) aiReply(line);
      return;
    }
    if(!line) return;

    var lower = line.toLowerCase();
    var sp = lower.indexOf(' ');
    var cmd = sp === -1 ? lower : lower.slice(0, sp);
    var arg = sp === -1 ? '' : line.slice(sp+1).trim();

    if(HANDLERS[lower]) return HANDLERS[lower]();          // exact (eggs w/ spaces)
    if(HANDLERS[cmd])   return HANDLERS[cmd](arg);         // command + arg

    // natural-language routing: 3+ words or a question mark => AI
    if(lower.indexOf('?') !== -1 || line.split(/\s+/).length >= 3){ return aiReply(line); }

    print('UNKNOWN COMMAND: '+esc(cmd)+'  <span class="dim">(try `help`)</span>', 'err');
  }

  /* ---- input events ---- */
  input.addEventListener('input', render);
  input.addEventListener('keydown', function(e){
    if(e.key === 'Enter'){ e.preventDefault(); var v = input.value; input.value=''; render(); run(v); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); if(hIdx>0){ hIdx--; input.value=history[hIdx]||''; render(); } }
    else if(e.key === 'ArrowDown'){ e.preventDefault(); if(hIdx<history.length){ hIdx++; input.value=history[hIdx]||''; render(); } }
    else if(e.key === 'Tab'){ e.preventDefault();
      var p = input.value.toLowerCase(), m = COMMANDS.filter(function(c){ return c.indexOf(p)===0; });
      if(m.length===1){ input.value = m[0]; render(); }
      else if(m.length>1){ print(m.join('   '), 'dim'); }
    }
    else if(e.key === 'Escape'){ if(aiMode){ setAI(false); input.value=''; render(); } }
  });

  // focus behavior: tap prompt row, or any printable key on desktop
  row.addEventListener('click', focusInput);
  term.addEventListener('click', function(e){ if(!e.target.closest('.hint')) focusInput(); });
  document.addEventListener('keydown', function(e){
    if(e.target === input) return;
    if(e.metaKey||e.ctrlKey||e.altKey) return;
    if(e.key.length === 1){ focusInput(); }
  });

  // clickable hint words + keycaps + Ask-AI button
  document.addEventListener('click', function(e){
    var r = e.target.closest('[data-run]'); if(r){ run(r.getAttribute('data-run')); focusInput(); return; }
    var a = e.target.closest('[data-ai]'); if(a){ if(!aiMode) setAI(true); focusInput(); return; }
    var k = e.target.closest('[data-cmd]'); if(k){ run(k.getAttribute('data-cmd')); focusInput(); }
  });

  /* ---- go ---- */
  type(boot, function(){ row.hidden = false; render(); focusInput(); });
})();

/* debug panel — build/phase status. Toggle with the gear button or ?debug in the URL */
(function(){
  var BUILD = { phase: 2, name: "terminal engine",
    done: ["typewriter boot","live input+cursor","commands","↑/↓ history","Tab autocomplete","ESC","easter eggs","NL→AI routing"],
    next: "Phase 3 — windows (popup panels)" };
  var btn = document.getElementById('dbgBtn'), box = document.getElementById('dbg');
  var reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  function render(){
    box.innerHTML =
      '<h4>DEBUG</h4>'+
      '<div>Phase: <b>'+BUILD.phase+'</b> — '+BUILD.name+'</div>'+
      '<div>Built: <span class="ok">'+BUILD.done.length+'</span> items</div>'+
      '<div style="color:var(--green-faint)">'+BUILD.done.join(' · ')+'</div>'+
      '<div style="margin-top:6px">Next: <b>'+BUILD.next+'</b></div>'+
      '<div style="margin-top:6px">Viewport: <b>'+innerWidth+'×'+innerHeight+'</b></div>'+
      '<div>Reduced-motion: <b>'+(reduced?'ON':'off')+'</b></div>'+
      '<div>AI endpoint: <b>not wired (Phase 6)</b></div>';
  }
  function toggle(){ box.classList.toggle('open'); if(box.classList.contains('open')) render(); }
  btn.addEventListener('click', toggle);
  if(/[?&]debug/.test(location.search)){ toggle(); }
  addEventListener('resize', function(){ if(box.classList.contains('open')) render(); });
})();
</script>

</body>
</html>
